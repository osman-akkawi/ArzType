name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests (real Windows layouts from CLDR)
        shell: pwsh
        run: dotnet run --project tests/ArzType.Tests -c Release
      - name: Accuracy benchmark
        shell: pwsh
        run: dotnet run --project tests/ArzType.Tests -c Release -- bench 600
      - name: Publish single-file ArzType.exe
        shell: pwsh
        run: dotnet publish src/ArzType.App/ArzType.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - name: End-to-end test in Notepad
        shell: pwsh
        continue-on-error: true
        run: dotnet run --project tests/ArzType.E2E -c Release -- publish/ArzType.exe
      - name: Upload ArzType.exe
        uses: actions/upload-artifact@v4
        with:
          name: ArzType-Windows-x64
          path: publish/ArzType.exe
